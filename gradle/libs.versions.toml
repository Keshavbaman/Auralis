[versions]
agp = "8.13.2"
kotlin = "2.3.10"
ksp = "2.3.14"
hilt = "2.57.2"
compose = "2025.12.01"
media3 = "1.11.1"
room = "2.8.5"
[libraries]
media3-cast = { module = "androidx.media3:media3-cast", version.ref = "media3" }
cast-framework = { module = "com.google.android.gms:play-services-cast-framework", version = "22.3.1" }
compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose" }
compose-ui = { module = "androidx.compose.ui:ui" }
compose-tooling = { module = "androidx.compose.ui:ui-tooling" }
compose-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
compose-test = { module = "androidx.compose.ui:ui-test-junit4" }
compose-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
material3 = { module = "androidx.compose.material3:material3" }
icons = { module = "androidx.compose.material:material-icons-extended" }
activity = { module = "androidx.activity:activity-compose", version = "1.12.4" }
splashscreen = { module = "androidx.core:core-splashscreen", version = "1.2.0" }
core = { module = "androidx.core:core-ktx", version = "1.17.0" }
lifecycle = { module = "androidx.lifecycle:lifecycle-runtime-compose", version = "2.10.0" }
viewmodel = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version = "2.10.0" }
navigation = { module = "androidx.navigation:navigation-compose", version = "2.9.7" }
exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
session = { module = "androidx.media3:media3-session", version.ref = "media3" }
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-testing = { module = "androidx.room:room-testing", version.ref = "room" }
datastore = { module = "androidx.datastore:datastore-preferences", version = "1.2.1" }
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
coil = { module = "io.coil-kt.coil3:coil-compose", version = "3.4.0" }
documentfile = { module = "androidx.documentfile:documentfile", version = "1.1.0" }
work = { module = "androidx.work:work-runtime-ktx", version = "2.11.1" }
vosk = { module = "com.alphacephei:vosk-android", version = "0.3.75" }
gson = { module = "com.google.code.gson:gson", version = "2.13.2" }
junit = { module = "junit:junit", version = "4.13.2" }
android-test = { module = "androidx.test.ext:junit", version = "1.3.0" }
test-runner = { module = "androidx.test:runner", version = "1.7.0" }
serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version = "1.12.0" }
[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
